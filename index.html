<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Happy 24th Birthday</title><meta name="theme-color" content="#17183f"><style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#17183f;font-family:Georgia,serif}
.scene{position:relative;width:100%;height:100svh;min-height:540px;overflow:hidden;color:#fff9e8;background:radial-gradient(circle at 50% 30%,#515799 0,#2d326d 43%,#17183f 100%)}
.prompt{position:absolute;z-index:6;top:18%;left:10px;right:10px;margin:0;text-align:center;font-size:clamp(25px,7vw,37px);transition:.5s}
.wish-star{-webkit-appearance:none;appearance:none;position:absolute;z-index:7;top:32%;left:50%;transform:translateX(-50%);width:155px;height:155px;padding:0;border:0!important;border-radius:50%;background:transparent!important;color:#ffe477!important;font:normal 136px/1 Arial,sans-serif!important;filter:drop-shadow(0 0 20px #ffe58a);cursor:pointer;animation:float 2.2s ease-in-out infinite;transition:.65s}
.on .prompt{opacity:0;transform:translateY(-15px)}
.on .wish-star{top:5%;width:55px;height:55px;font-size:46px!important;transform:translateX(-50%) rotate(360deg);animation:none}
.words{position:absolute;z-index:4;top:20%;left:4px;right:4px;opacity:0;transform:scale(.72);transition:opacity .8s .25s,transform .8s .25s}
.on .words{opacity:1;transform:scale(1)}
.wordline{display:flex;justify-content:center;gap:5px;margin:0 auto 19px}
.letter{display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(7,1fr);width:25px;height:35px}
.pixel{display:grid;place-items:center;color:#fff1a8;font:normal 10px/1 Arial,sans-serif;opacity:0}
.pixel.lit{opacity:1;animation:letterTwinkle 1.9s ease-in-out infinite;filter:drop-shadow(0 0 3px #fff) drop-shadow(0 0 9px #ffd45e)}
.land{position:absolute;z-index:2;left:-10%;right:-10%;bottom:-7%;height:30%;border-radius:50% 50% 0 0;background:#315d49;box-shadow:inset 0 13px #4d7a5c}
.cake{position:absolute;z-index:5;left:50%;bottom:8%;width:190px;height:235px;transform:translate(-50%,120%);transition:transform .9s 1s cubic-bezier(.2,1.3,.45,1)}
.on .cake{transform:translate(-50%,0)}
.tier{position:absolute;left:50%;transform:translateX(-50%);border-radius:15px 15px 8px 8px;background:#ffd6df;border:4px solid #fff0dc;box-shadow:inset 0 -10px #e9a9bd}
.tier:after{content:"";position:absolute;left:8px;right:8px;top:9px;height:10px;border-radius:50%;background:repeating-linear-gradient(90deg,#fff0dc 0 12px,#f3b8ca 12px 24px)}
.t1{bottom:0;width:180px;height:68px}
.t2{bottom:59px;width:142px;height:60px}
.t3{bottom:110px;width:104px;height:55px}
.candles{position:absolute;z-index:9;left:50%;bottom:162px;display:flex;gap:8px;transform:translateX(-50%)}
.candle{position:relative;display:block;width:9px;height:38px;border:2px solid #fff8e8;border-bottom:0;border-radius:5px 5px 0 0;background:#7fd2e7}
.candle:nth-child(2n){background:#f7a8bd}
.candle:nth-child(3n){background:#c7a8ed}
.candle:before{content:"";position:absolute;left:50%;top:-18px;width:11px;height:17px;transform:translateX(-50%);border-radius:75% 25% 65% 35%;background:linear-gradient(#fff9b2 0 30%,#ffd04f 45%,#ff9a42 100%);box-shadow:0 0 7px #fff4a3,0 0 15px #ffca52;animation:flame .65s ease-in-out infinite alternate}
.spark{position:absolute;color:#fff0a3;font-style:normal;opacity:.22;animation:twinkle 2s ease-in-out infinite}
@keyframes float{50%{transform:translateX(-50%) translateY(-10px) scale(1.04)}
}
@keyframes twinkle{50%{opacity:.65;transform:scale(1.3)}
}
@keyframes letterTwinkle{0%,100%{opacity:.52;transform:scale(.7);filter:drop-shadow(0 0 2px #fff) drop-shadow(0 0 5px #ffd45e)}45%{opacity:1;transform:scale(1.42) rotate(9deg);color:#fffbe3;filter:drop-shadow(0 0 5px #fff) drop-shadow(0 0 15px #ffd45e)}68%{opacity:.82;transform:scale(1)}}
@keyframes flame{to{transform:translateX(-50%) scale(.78) rotate(7deg)}
}
@media(max-height:650px){.prompt{top:11%}
.wish-star{top:22%}
.on .wish-star{top:1%}
.words{top:14%}
.cake{height:210px;bottom:3%;transform:translate(-50%,120%) scale(.86);transform-origin:bottom}
.on .cake{transform:translate(-50%,0) scale(.86)}
.land{height:27%}
}
@media(max-width:350px){.wordline{gap:3px}
.letter{width:21px;height:30px}
.pixel{font-size:7px}
.cake{transform:translate(-50%,120%) scale(.9)}
.on .cake{transform:translate(-50%,0) scale(.9)}
}

</style></head><body><main class="scene"><div class="sky" aria-hidden="true"></div><p class="prompt">Make a wish for Sterre.</p><button class="wish-star" type="button" aria-label="Make a birthday wish">★</button><div class="words" aria-label="Happy Birthday"><div class="wordline" data-word="HAPPY"></div><div class="wordline" data-word="BIRTHDAY"></div></div><div class="land"></div><div class="cake" aria-hidden="true"><div class="candles"><i class="candle"></i><i class="candle"></i><i class="candle"></i><i class="candle"></i><i class="candle"></i></div><div class="tier t3"></div><div class="tier t2"></div><div class="tier t1"></div></div></main><script>
(function(){var s=document.querySelector('.scene'),b=document.querySelector('.wish-star'),sky=document.querySelector('.sky'),P={A:['01110','10001','10001','11111','10001','10001','10001'],B:['11110','10001','10001','11110','10001','10001','11110'],D:['11110','10001','10001','10001','10001','10001','11110'],H:['10001','10001','10001','11111','10001','10001','10001'],I:['11111','00100','00100','00100','00100','00100','11111'],P:['11110','10001','10001','11110','10000','10000','10000'],R:['11110','10001','10001','11110','10100','10010','10001'],T:['11111','00100','00100','00100','00100','00100','00100'],Y:['10001','10001','01010','00100','00100','00100','00100']}
;document.querySelectorAll('.wordline').forEach(function(line){line.dataset.word.split('').forEach(function(ch,li){var l=document.createElement('span');l.className='letter';P[ch].join('').split('').forEach(function(v,i){var q=document.createElement('i');q.className='pixel'+(v==='1'?' lit':'');q.textContent=v==='1'?'✦':'';q.style.animationDelay=((li*7+i)%13*.08)+'s';l.appendChild(q)}
);line.appendChild(l)}
)}
);for(var i=0;i<34;i++){var e=document.createElement('i');e.className='spark';e.style.left=(3+(i*37)%94)+'%';e.style.top=(3+(i*53)%84)+'%';e.style.fontSize=(7+i%4*3)+'px';e.style.animationDelay=(i%9*.17)+'s';e.textContent='✦';sky.appendChild(e)}
var n=[[392,.28],[392,.18],[440,.45],[392,.45],[523,.45],[494,.8],[392,.28],[392,.18],[440,.45],[392,.45],[587,.45],[523,.8],[392,.28],[392,.18],[784,.45],[659,.45],[523,.45],[494,.45],[440,.8],[698,.28],[698,.18],[659,.45],[523,.45],[587,.45],[523,.9]];function song(){try{var A=window.AudioContext||window.webkitAudioContext,c=new A(),t=c.currentTime+.04;n.forEach(function(q){var o=c.createOscillator(),g=c.createGain(),f=q[0],d=q[1];o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.001,t);g.gain.linearRampToValueAtTime(.13,t+.025);g.gain.setValueAtTime(.09,t+d*.72);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+.03);t+=d}
)}
catch(e){}
}
b.onclick=function(){if(s.classList.contains('on'))return;s.classList.add('on');song()}
}
)();
</script></body></html>
